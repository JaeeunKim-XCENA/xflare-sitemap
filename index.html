<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XFLARE Sitemap</title>
  <link rel="icon" href="xflare-logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script>
    // 저장된 테마를 첫 렌더 전에 적용해서 새로고침 때 반대 테마가 번쩍이지 않게 한다.
    try {
      const saved = localStorage.getItem("xflare-sitemap-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-hover: #ffffff;
      --border: #e2e5ea;
      --text: #15171c;
      --muted: #545a65;
      --faint: #868c97;
      --accent: #ffc20e;
      --accent-text: #8f6300;
      --ok: #12945a;
      --down: #d33a48;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04);
      --shadow-hover: 0 10px 28px rgba(16, 24, 40, .09);
      --logo-on-dark: none;
      --logo-on-light: block;
      --icon-sun: none;
      --icon-moon: block;
      --radius: 14px;
      --logo-h: 30px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0b0c0f;
        --card: #14161a;
        --card-hover: #181b20;
        --border: #24272e;
        --text: #f1f2f4;
        --muted: #9aa0aa;
        --faint: #6b717c;
        --accent-text: #ffc20e;
        --ok: #3ecf8e;
        --down: #f0616d;
        --shadow: none;
        --shadow-hover: 0 10px 28px rgba(0, 0, 0, .35);
        --logo-on-dark: block;
        --logo-on-light: none;
        --icon-sun: block;
        --icon-moon: none;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0c0f;
      --card: #14161a;
      --card-hover: #181b20;
      --border: #24272e;
      --text: #f1f2f4;
      --muted: #9aa0aa;
      --faint: #6b717c;
      --accent-text: #ffc20e;
      --ok: #3ecf8e;
      --down: #f0616d;
      --shadow: none;
      --shadow-hover: 0 10px 28px rgba(0, 0, 0, .35);
      --logo-on-dark: block;
      --logo-on-light: none;
      --icon-sun: block;
      --icon-moon: none;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 24px 48px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 40px;
    }

    .logo { height: var(--logo-h); }
    .logo.on-dark { display: var(--logo-on-dark); }
    .logo.on-light { display: var(--logo-on-light); }

    h1 {
      margin: 20px 0 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-text);
    }

    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      flex: none;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }

    .theme-toggle:hover {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .sun { display: var(--icon-sun); }
    .theme-toggle .moon { display: var(--icon-moon); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      padding: 22px 22px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tag {
      padding: 2px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--faint);
      font-size: 12px;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }

    .status[data-state="up"] { color: var(--ok); }
    .status[data-state="up"]::before { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
    .status[data-state="down"] { color: var(--down); }
    .status[data-state="down"]::before { background: var(--down); }

    .card h2 {
      margin: 6px 0 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .addr {
      overflow: hidden;
      color: var(--faint);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .arrow {
      flex: none;
      color: var(--faint);
      font-size: 18px;
      line-height: 1;
      transition: color .15s ease, transform .15s ease;
    }

    .card:hover .arrow {
      color: var(--accent-text);
      transform: translateX(3px);
    }

    footer {
      margin-top: 40px;
      color: var(--faint);
      font-size: 13px;
    }

    footer code {
      padding: 1px 6px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 520px) {
      :root { --logo-h: 26px; }
      .wrap { padding: 36px 16px 32px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .card, .arrow, .theme-toggle { transition: none; }
      .card:hover { transform: none; }
      .card:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <img class="logo on-dark" src="xflare-logo-on-dark.png" alt="XFLARE">
        <img class="logo on-light" src="xflare-logo-on-light.png" alt="XFLARE">
        <h1>Sitemap</h1>
        <p class="lede">XFLARE 개발에 쓰는 보조 사이트 모음</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </header>

    <main class="grid" id="sites">
      <noscript>카드 목록은 JavaScript로 그려집니다. 주소는 sites.js에 있습니다.</noscript>
    </main>

    <footer>사이트 추가·수정은 <code>sites.js</code>만 고치면 됩니다.</footer>
  </div>

  <script src="sites.js"></script>
  <script>
    const PROBE_TIMEOUT_MS = 4000;
    const THEME_KEY = "xflare-sitemap-theme";

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function renderCard(site) {
      const url = new URL(site.url);

      const card = el("a", "card");
      card.href = site.url;

      const top = el("div", "card-top");
      top.append(el("span", "tag", site.tag));
      const status = el("span", "status", "확인 중");
      top.append(status);

      const foot = el("div", "card-foot");
      foot.append(el("span", "addr", url.host + url.pathname.replace(/\/$/, "")));
      foot.append(el("span", "arrow", "→"));

      card.append(top, el("h2", null, site.name), el("p", null, site.description), foot);
      probe(site.url, status);
      return card;
    }

    // no-cors 응답은 내용을 읽을 수 없지만, 응답이 오기만 하면 resolve되고
    // 연결이 안 되면 reject되므로 접속 가능 여부를 판단하기엔 충분하다.
    async function probe(href, status) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), PROBE_TIMEOUT_MS);
      try {
        await fetch(href, { method: "HEAD", mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        status.dataset.state = "up";
        status.textContent = "Online";
      } catch {
        status.dataset.state = "down";
        status.textContent = "Offline";
      } finally {
        clearTimeout(timer);
      }
    }

    // 직접 고른 테마가 없으면 OS 설정을 따른다.
    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const toggle = document.getElementById("theme-toggle");

    function currentTheme() {
      return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
    }

    function labelToggle() {
      const label = currentTheme() === "dark" ? "라이트 테마로 전환" : "다크 테마로 전환";
      toggle.title = label;
      toggle.setAttribute("aria-label", label);
    }

    toggle.addEventListener("click", () => {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(THEME_KEY, next); } catch {}
      labelToggle();
    });
    darkQuery.addEventListener("change", labelToggle);
    labelToggle();

    document.getElementById("sites").append(...(window.SITES || []).map(renderCard));
  </script>
</body>
</html>
